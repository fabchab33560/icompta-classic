.toolbar button:active {background:#31567a}.toolbar b{font-size:21px;line-height:20px}.toolbar small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}

.panel {border:1px solid #a5b1bd;border-radius:11px;background:#fff;overflow:hidden;box-shadow:0 1px 1px #60718538}.listrow {border:0;border-bottom:1px solid #dfe4e8;display:flex;align-items:center;width:100%;min-height:58px;padding:8px 9px;background:#fff;color:#1d252c;text-align:left;gap:9px}.listrow:last-child{border-bottom:0}.listrow:active {background:#e6f1fa}

.rowmain {flex:1;min-width:0}.rowmain strong {font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowsub {font-size:10px;color:#5f6b77;line-height:1.35;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.chevron{color:#8295a9;font-size:24px;line-height:20px;}

.month{background:linear-gradient(#aebfd2,#748ba6);color:#fff;text-shadow:0 -1px #59708a;font-size:12px;font-weight:700;padding:7px 10px}
.txrow {display:flex;align-items:stretch;min-height:63px;background:white;border-bottom:1px solid #e1e5ea;}.txrow:active{background:#eff6ff}.txaccent{width:5px;background:#d48db2;margin:5px 0}.txaccent.credit{background:#6ca0ba}.txstatus{border:0;min-width:34px;background:transparent;font-size:19px;color:#8498ad}.txstatus.done{color:#3b7d9b}.txstatus.cancelled{color:#aaa}
.txinfo{flex:1;display:flex;align-items:center;justify-content:space-between;gap:5px;border:0;text-align:left;background:transparent;min-width:0;padding:8px 6px 8px 0;color:#1f252c}.txtext{min-width:0;flex:1}.txlabel{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmeta{display:block;font-size:10px;color:#7a8592;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmoney{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:116px;padding-right:2px}.txbalance{font-size:11px;color:#8c969e;line-height:1.15;font-variant-numeric:tabular-nums}.txamount{font-size:16px;font-weight:750;color:#d53038;margin-top:2px;line-height:1.15;font-variant-numeric:tabular-nums}.txamount.credit{color:#318251}.txrow.cancelled .txlabel{text-decoration:line-through;color:#999}.txarrow{color:#6793bc;font-size:20px;padding:0 5px}
.fields{padding:2px 8px 14px}.fieldpanel{background:#fff;border:1px solid #a6b4c1;border-radius:10px;overflow:hidden;margin:12px 0}.field{min-height:49px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #e3e6ea}.field:last-child{border:0}.field label{width:100px;flex:none;color:#4267a0;font-size:12px;text-align:right}.field input,.field select,.field textarea{min-width:0;flex:1;border:0;background:#fff;color:#28313a;outline:none;padding:7px 1px}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #a0c9ed;border-radius:2px}.field textarea{resize:vertical;min-height:48px}
.switches {display:flex;gap:5px;padding:9px}.switches button{flex:1;padding:8px 6px;border-radius:7px;border:1px solid #aebdca;background:linear-gradient(#fff,#e2eaf1);color:#374f66;font-size:12px}.switches button.active{background:linear-gradient(#8db2d8,#416da0);color:#fff;font-weight:bold;border-color:#325e91}.hint{padding:6px 11px;background:#f4faff;color:#356597;font-size:12px}.hint button,.textbtn{background:transparent;border:0;color:#2c6093;font-size:12px;text-decoration:underline;padding:5px}
.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px}.softbtn{background:linear-gradient(#fff,#e4ecf3);border:1px solid #aabac9;border-radius:7px;padding:8px 10px;color:#355b80;font-weight:600;font-size:12px}.danger{width:calc(100% - 16px);margin:12px 8px;background:#fff;color:#c23138;border:1px solid #d3b8bc;border-radius:8px;padding:12px;font-weight:600}.error{font-size:12px;color:#bc2432;text-align:center;min-height:12px;padding:0 5px}.empty {padding:28px 10px;text-align:center;color:#718395}
.report-header{padding:10px 12px;background:#fff;border-bottom:1px solid #c5d1dd;font-weight:700;color:#2e4d68}.reportrow{padding:10px 10px 12px;background:#fff;border-bottom:1px solid #e1e5ea}.reportname{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:650;margin-bottom:7px}.reportnums{display:flex;justify-content:space-between;gap:5px;font-size:10px;color:#667483;margin-top:6px;flex-wrap:wrap}.progress{height:12px;border-radius:2px;background:#f0f3f4;border:1px solid #bec7cf;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(#8dc959,#5aa435);min-width:0}.progress>span.warn{background:linear-gradient(#f9b07d,#df6c38)}.progress>span.income{background:linear-gradient(#aad67e,#6cb244)}
.totals{padding:14px 12px;background:#f9fcff;border-bottom:1px solid #c8d4df;display:flex;justify-content:space-between;gap:8px}.totals>div{flex:1;text-align:center}.totals small{display:block;color:#728092;font-size:10px;margin-bottom:4px}.totals b{font-size:15px}
.pickerrow {display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f9fcff;gap:8px;border-bottom:1px solid #c7d3df}.pickerrow button {min-width:34px;border:1px solid #a3b9cb;background:#fff;border-radius:5px;padding:7px;color:#3a6293;font-size:14px}.pickerrow strong{font-size:12px;text-align:center}
.chartbox{background:#fff;border-radius:11px;border:1px solid #a5b2bf;margin:12px 8px;padding:12px;overflow:hidden}.chartbox svg{width:100%;display:block;max-height:295px}.chartbox h3{font-size:14px;text-align:center;margin:0 0 8px;color:#39516b}.chart-legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 9px;margin:10px 0 2px;font-size:11px}.legenditem{display:flex;align-items:center;gap:5px;min-width:0}.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;flex:none}.legenditem span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chart-summary{text-align:center;font-size:13px;color:#495d72;margin:10px 5px;font-weight:650}

.accountchecks{padding:9px 13px;display:grid;gap:11px}.accountchecks label{display:flex;align-items:center;gap:9px;color:#34495b;font-size:13px}.accountchecks input{width:17px;height:17px}
.info{padding:12px 17px;color:#344c65;line-height:1.6}.info h3{margin:10px 0}.info p{margin:9px 0}.info code{font-size:12px}.muted{color:#758696}.smallnote{font-size:11px;color:#687888;line-height:1.5;padding:8px 10px}
@media(max-width:700px), (display-mode:standalone) {
 html,body{width:100%;height:100%;min-height:0;background:#d9e2ea;}
 .device{width:100vw;height:100dvh;max-width:none;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none;}
 .status{display:none}
 .navbar{padding-top:env(safe-area-inset-top);min-height:calc(49px + env(safe-area-inset-top));}
 .toolbar{padding-bottom:env(safe-area-inset-bottom);min-height:calc(53px + env(safe-area-inset-bottom));}
}
@media(max-width:360px){.navbar{grid-template-columns:79px minmax(0,1fr) 79px}.navbtn{padding:5px 6px}.field label{width:85px}.budget-line{grid-template-columns:1fr 63px 72px 26px}.toolbar small{font-size:9px}}
@media(prefers-reduced-motion:no-preference){button{transition:filter .1s}}

/* V0.4 · recurring transactions / dual budget indicators */
.catname{display:inline-flex;align-items:center;gap:8px;min-width:0}
.swatch{display:inline-block;flex:none;width:12px;height:12px;border-radius:3px;vertical-align:middle;border:1px solid #344c5930}
.swatch.big{width:24px;height:24px;border-radius:5px}
.remaining{font-size:11px;white-space:nowrap;color:#516476}
.reportname{align-items:center}
.budget-line{display:grid;grid-template-columns:14px minmax(50px,1fr) 76px 82px 27px;gap:4px;align-items:center}
.budget-line select,.budget-line input{max-width:100%;min-width:0;font-size:12px;padding:7px 2px}
.budget-line .removeLine{color:#c14b4b;border:0;background:none;font-weight:bold;font-size:17px}
.danger-inline{color:#c43541}
.field input[type=color]{height:35px;min-width:58px;max-width:90px;border:1px solid #9fb1c3;border-radius:5px;padding:1px}
.warning{color:#aa342e}
@media(max-width:360px){.budget-line{grid-template-columns:12px minmax(55px,1fr) 65px 68px 23px;gap:3px}}

.dual-report{padding:12px 11px 14px}
.dual-row{margin-top:9px}
.dual-label{display:flex;justify-content:space-between;align-items:center;color:#43566b;font-size:12px;padding:2px 0}
.dual-label b{font-size:13px;color:#202c3d;font-variant-numeric:tabular-nums}
.progress.slim{height:7px;margin-top:4px}
.dual-report .reportnums{margin-top:9px;flex-wrap:wrap;gap:3px;font-size:10px}
.recurring-badge{color:#326394;font-weight:bold;font-size:16px;vertical-align:middle}
.softbtn.wide{display:block;width:calc(100% - 24px);margin:12px auto;background:white;padding:12px}
#repeatEndArea .field{min-height:52px}

/* Plein écran iPhone Air, agrandissement clavier et barres système prises en charge */
html{overscroll-behavior:none}body{overflow:hidden}
button, input, select{touch-action:manipulation}
.importbox{padding:13px;line-height:1.6;font-size:12px;overflow-wrap:anywhere}
.info input[type=file]{background:white;border:1px solid #adbac7;border-radius:8px;padding:12px;max-width:100%;width:100%;font-size:12px}
@media(max-width:700px), (display-mode:standalone){
  .device{height:100dvh;width:100vw;max-height:none;max-width:none;min-height:0;border-radius:0;border:none;box-shadow:none}
  .navbar{padding-top:env(safe-area-inset-top,0px)}
  .content{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  .toolbar{padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* V0.7 : aspect construit à partir des photographies fournies d'iCompta 2 */
:root{--vintage-blue:#7e9fb8;--vintage-title:#262e38;}
body{background:#e3e3e7}
.device{background:#f9fafc}
.status{background:#f6f7f9;color:#7b8895;font-weight:500;border-bottom:1px solid #e4e6e8}
.navbar{background:linear-gradient(#fff,#f6f7f8);box-shadow:none;border-bottom:1px solid #d9dde2;color:var(--vintage-title);text-shadow:none}
.navbar h1{font-size:19px;font-weight:700}
.navbtn{background:none;border:0;box-shadow:none;text-shadow:none;color:#87a7c4;font-size:14px;font-weight:500;padding:5px 3px;text-align:left}
.navbar .navright .navbtn{text-align:right}
.content{background:repeating-linear-gradient(0deg,#f5f6f7 0,#f5f6f7 2px,#fbfbfc 2px,#fbfbfc 4px)}
.group{margin:0 0 12px}
.group h2{font-size:14px;font-weight:500;text-transform:uppercase;text-shadow:none;letter-spacing:.35px;background:#edf0f3;color:#89939d;margin:0;padding:10px 14px 8px;border-top:1px solid #dde1e5;border-bottom:1px solid #dde1e5}
.panel{border:0;border-radius:0;box-shadow:none;background:white}
.listrow{min-height:67px;padding:7px 13px;border-bottom:1px solid #e5e6e9;gap:10px}
.rowmain strong{font-size:17px;font-weight:500}
.rowsub{font-size:12px;color:#7d8993;margin-top:3px}
.accounticon{width:34px;height:35px;border-radius:0;background:none!important;color:#7494ac;font-size:26px}
.chevron{color:#c2c7ce;font-size:30px;font-weight:200}
.toolbar{background:linear-gradient(#f5f6f8,#eef1f3);border-top:1px solid #dadee3;box-shadow:none;min-height:58px}
.toolbar button{color:#7e9db9;text-shadow:none;border-right:0}
.toolbar b{font-size:24px;line-height:26px}
.toolbar small{font-size:10px}
.notice{margin:0;padding:8px 12px;font-size:10px;color:#7c878f;font-weight:500;background:#fafafa;border-bottom:1px solid #e3e5e7}
.home-total{background:#f6f7f8;color:#7e8690;padding:9px 16px;font-size:13px;border-bottom:1px solid #e1e3e6;font-variant-numeric:tabular-nums}
.home-lead{color:#748aa1;font-weight:500}
.home-sub{color:#8b929b;font-size:12px}
.month{background:#e4e8eb;color:#292f36;font-weight:700;text-shadow:none;font-size:16px;padding:8px 13px;border-top:1px solid #d6dae0}
.summary{background:#fff;color:#777;padding:6px 12px;font-size:12px}
.summary .balance{color:#3e4751}
.summary strong{color:#7b8590}
.subbar{background:#f1f3f5;color:#7a8794;border-bottom:1px solid #dce1e5}
.txrow{min-height:73px;background:linear-gradient(#fff,#fefefe)}
.txaccent{width:7px;margin:0;flex:none}
.txstatus{min-width:28px;font-size:17px;color:#aab3bc;order:1;padding:0 1px}
.txstatus.done{color:#707982}
.txinfo{order:0;padding:8px 1px 8px 9px}
.txlabel{font-size:16px;font-weight:500;color:#41484c}
.txmeta{font-size:11px;color:#a1a7ad;margin-top:6px}
.txbalance{font-size:12px;color:#8b9299;line-height:1.1;font-variant-numeric:tabular-nums}
.txamount{font-size:18px;font-weight:750;margin-top:2px;color:#d02430;line-height:1.1;font-variant-numeric:tabular-nums}

.txarrow{font-size:24px;color:#bac6d2}

/* Budget annuel inspiré de la photo : une barre par catégorie et trois montants */
.annual-budget{background:#fff;min-height:100%;padding-bottom:18px}
.annual-budget .pickerrow{background:linear-gradient(#fff,#f8f9fa);color:#393e45;border-bottom:1px solid #e6e8eb}
.annual-budget .pickerrow strong{font-size:18px}
.budget-overview{padding:9px 12px 4px;border-bottom:0;background:#fff}
.budget-total{font-size:17px;font-weight:800;color:#242a31;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.budget-caption{display:none}
.budget-category{padding:4px 10px 8px;background:#fff;border-bottom:1px solid #e8ebed}
.budget-catname{font-size:14px;font-weight:500;color:#555d66;padding:2px 0 5px}
.budget-meter{height:24px;position:relative;background:linear-gradient(#f7f8f9,#ebedef);border:1px solid #aeb8c1;box-shadow:inset 0 1px 3px #5555;overflow:hidden;display:flex;width:100%;border-radius:1px}
.budget-meter-real{height:100%;position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:#fff;font-weight:750;text-shadow:0 1px #0005;font-size:13px;background:var(--cat);box-shadow:inset 0 3px #ffffff33,inset 0 -3px #00000020;min-width:0;overflow:hidden;}
.budget-meter-future{height:100%;position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap;color:#3c4350;font-size:12px;font-weight:700;background:var(--softcat);border-left:1px solid #343a4122;min-width:0;overflow:hidden}
.budget-meter-rest{flex:1;min-width:0;display:flex;justify-content:flex-end;align-items:center;padding-right:5px;color:#6d757f;font-size:11px;white-space:nowrap;font-weight:700;overflow:hidden}
.budget-tick{position:absolute;top:0;height:100%;width:2px;background:#656a70;transform:translateX(-1px);pointer-events:none;opacity:.5}
.budget-columns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding-top:7px;font-size:11px}
.budget-columns .c{min-width:0}
.budget-columns .c:nth-child(2){text-align:center}
.budget-columns .c:nth-child(3){text-align:right}
.budget-columns .c span{display:block;color:#9aa1a9;font-size:10px;margin-bottom:3px;white-space:normal;line-height:1.3}
.budget-columns .c strong{display:block;color:#626b74;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget-columns .c:nth-child(2) strong{color:#a64c58;font-weight:700}
.budget-mininote{margin:12px 14px;font-size:11px;color:#788692;line-height:1.5}
.budget-title-line{padding:11px 12px 5px;color:#373e45;font-weight:750;font-size:16px;background:white}

<body>
<div class="device" id="device" role="application" aria-label="iCompta Classic hors connexion">
 <div class="status"><span>●●● iCompta Classic</span><span>V1.8 · LOCAL ▰</span></div>

 <main class="content" id="content"></main>

<script>'use strict';
const APP_VERSION = '1.8';
const KEY = 'icompta-classic-local-v08';
const LEGACY = ['icompta-classic-local-v07','icompta-classic-local-v06']; // Les anciennes versions sont conservées en lecture seule
const $ = id => document.getElementById(id);
const escapeHTML = v => String(v ?? '').replace(/[&<>"']/g, x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
const euro = v => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}).format(v/100);
// Enter whole euros without discarding any historic cents if the input is unchanged.
const moneyInput = v => String(Math.round(Math.abs(v || 0)/100));
const inputMoneyPreserve = (id, originalCents, allowZero=false) => {
  const raw=$(id).value.trim();
  if(raw===moneyInput(originalCents)) return Math.abs(originalCents||0);
  return cents(raw,allowZero);
};
const cents = (v, zero=false) => {
  const s=String(v).trim().replace(/[\s€\u00a0\u202f]/g,'').replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const [a,b='']=s.split('.');
  const n=Number(a)*100+Number((b+'00').slice(0,2));
  return Number.isSafeInteger(n)&&(zero||n>0)?n:null;
};
const uid = () => (globalThis.crypto?.randomUUID?.() || ('d'+Math.random().toString(36).slice(2)));
const dayISO = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const today = () => dayISO(new Date());
const daysAgo = n => {let d=new Date();d.setDate(d.getDate()-n);return dayISO(d)};
const startYear = year => `${year}-01-01`;
const monthLabel = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const dateLabel = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR');
// Stable calendar-month rollover: January 31 -> February 28 -> March 31.
function nextRepeat(t) {
  const date=new Date(t.date+'T12:00:00Z');
  if(t.recurrence==='monthly') {
    const month=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,1,12));
    const anchor=Number(t.repeatDay)||date.getUTCDate();
    month.setUTCDate(Math.min(anchor,new Date(Date.UTC(month.getUTCFullYear(),month.getUTCMonth()+1,0)).getUTCDate()));
    return month.toISOString().slice(0,10);
  }
  if(t.recurrence==='fourweeks') {
    date.setUTCDate(date.getUTCDate()+28);
    return date.toISOString().slice(0,10);
  }
  return null;
}
function recurringProjections(year) {
  const start=`${year}-01-01`,end=`${year+1}-01-01`,result=[];
  const exists=new Set(data.transactions.map(t=>[t.account,t.date,t.label,t.amount,t.category].join('¦')));
  for(const original of data.transactions){
    if(!['monthly','fourweeks'].includes(original.recurrence)||original.status==='cancelled'||original.transferId)continue;
    let cursor=original;
    for(let i=0;i<1200;i++) {
      const next=nextRepeat(cursor);
      if(!next||next<=cursor.date||next>=end||(original.repeatEnd && next>original.repeatEnd))break;
      cursor={...cursor,date:next,status:'pending',repeatDay:original.repeatDay||Number(original.date.slice(8,10))};
      if(next>=start&&!exists.has([cursor.account,next,cursor.label,cursor.amount,cursor.category].join('¦')))result.push({...cursor,id:'forecast:'+original.id+':'+next,virtual:true});
    }
  }
  return result;
}
// A newly generated occurrence is independent; only the next instance keeps the repeat flag.
function createNextOccurrence(id,quiet=false) {
  const tx=data.transactions.find(t=>t.id===id);
  if(!tx || !['monthly','fourweeks'].includes(tx.recurrence)||tx.transferId)return false;
  const next=nextRepeat(tx);
  if(!next||(tx.repeatEnd&&next>tx.repeatEnd))return false;
  const rule=tx.recurrence, anchor=tx.repeatDay||Number(tx.date.slice(8,10));
  const newTx={...tx,id:uid(),date:next,status:'pending',clearedOn:null,
    recurrence:rule,repeatDay:anchor};
  tx.recurrence='none';
  data.transactions.push(newTx);
  persist();
  if(!quiet)render();
  return true;
}
function noticeHorizon(t) {
  const dt=new Date();
  const notice=t.repeatNotice||(t.recurrence==='fourweeks'?'fourweeks':'month');
  if(notice==='month'){
    const month=new Date(dt.getFullYear(),dt.getMonth()+1,1,12);
    const max=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
    month.setDate(Math.min(dt.getDate(),max));
    return dayISO(month);
  }
  dt.setDate(dt.getDate()+(notice==='fourweeks'?28:7));
  return dayISO(dt);
}
function autoAdvanceRecurrences() {
  for(let i=0;i<300;i++){
    const due=data.transactions.find(t=>['monthly','fourweeks'].includes(t.recurrence)&&
      !t.transferId&&t.status!=='cancelled'&&nextRepeat(t)&&
      nextRepeat(t)<=noticeHorizon(t)&&(!t.repeatEnd||nextRepeat(t)<=t.repeatEnd));
    if(!due||!createNextOccurrence(due.id,true))break;
  }
}

const DEFAULT_COLORS = {
  'Alimentation':'#63a459','Logement':'#5184ba','Transport':'#e19648',
  'Salaire':'#459b78','Santé':'#cf6c68','Loisirs':'#a075b9',
  'Autre':'#8c9ba8','Transfert':'#55799c'
};
const safeHex = x => /^#[0-9a-f]{6}$/i.test(String(x))?x.toLowerCase():'#8c9ba8';
const encodeName = s => encodeURIComponent(s).replace(/'/g,'%27');
const clone = x => JSON.parse(JSON.stringify(x));
const activeCategories = () => data.categories.filter(c=>c.active).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
const category = name => data.categories.find(c=>c.name===name);
const categoryColor = name => safeHex(category(name)?.color || DEFAULT_COLORS[name] || '#8c9ba8');

const account = id => data.accounts.find(a=>a.id===id);
const txFor = id => data.transactions.filter(t=>t.account===id).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
// Les pastilles utilisent directement la couleur #RRGGBB stockée dans la catégorie.
function categorySelector(selected, fieldClass='category-value', fieldId=''){
  const color=categoryColor(selected);
  const id=fieldId?` id="${escapeHTML(fieldId)}"`:'';
  const current=selected||'Sans catégorie';
  return `<div class="category-selector">
    <input type="hidden" class="category-value ${escapeHTML(fieldClass)}"${id} value="${escapeHTML(current)}">
    <button type="button" class="category-trigger" onclick="openCategoryPicker(this)" aria-haspopup="dialog" aria-label="Choisir une catégorie. Sélection actuelle : ${escapeHTML(current)}">
      <span class="category-color-chip" style="background-color:${color}" aria-hidden="true"></span>
      <span class="category-trigger-name">${escapeHTML(current)}</span>
      <span class="category-trigger-arrow" aria-hidden="true">⌄</span>
    </button>
  </div>`;
}

let categoryPickerFocus=null;
function closeCategoryPicker(returnFocus=true){
  if(categoryPickerOpenTimer!==null){clearTimeout(categoryPickerOpenTimer);categoryPickerOpenTimer=null;}
  const overlay=document.getElementById('categoryPickerOverlay');
  if(overlay) overlay.remove();
  const previous=categoryPickerFocus;
  categoryPickerFocus=null;
  if(returnFocus && previous?.isConnected)previous.focus({preventScroll:true});
}
let categoryPickerOpenTimer=null;
function openCategoryPicker(trigger){
  if(categoryPickerOpenTimer!==null){clearTimeout(categoryPickerOpenTimer);categoryPickerOpenTimer=null;}
  closeCategoryPicker(false);
  const box=trigger.closest('.category-selector');
  const input=box?.querySelector('input.category-value');
  if(!input)return;
  // Dissipe le clavier numérique avant d'ouvrir la liste. Ne modifie pas le montant saisi.
  if(document.activeElement?.blur) document.activeElement.blur();
  categoryPickerFocus=trigger;
  const selected=input.value;
  const openPickerPanel=()=>{
  categoryPickerOpenTimer=null;
  if(!trigger.isConnected || !input.isConnected || !document.getElementById('device'))return;
  // « Alimentation » n'est plus proposée pour les transactions.
  // Elle reste sélectionnable si on modifie une ancienne écriture déjà classée ainsi.
  // Le budget et l'historique des catégories ne sont pas modifiés.
  const isTransactionChoice=input.id==='tCategory';
  const names=[...new Set([...activeCategories().filter(x=>
      x.name!=='Transfert' && !(isTransactionChoice && x.name==='Alimentation')
    ).map(x=>x.name),selected])]
    .filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
  const overlay=document.createElement('div');
  overlay.id='categoryPickerOverlay';
  overlay.className='category-picker-overlay';
  overlay.innerHTML=`<section class="category-picker-sheet" role="dialog" aria-modal="true" aria-label="Choisir une catégorie">
    <div class="category-picker-head"><strong>Choisir une catégorie</strong><button type="button" class="category-picker-close" data-close>Fermer</button></div>
    <div class="category-picker-list" role="list">
      ${names.map((name,i)=>`<button type="button" role="listitem" class="category-picker-item${name===selected?' selected':''}" data-category-index="${i}" aria-label="${escapeHTML(name)}${name===selected?', sélectionnée':''}">
        <span class="category-picker-color" aria-hidden="true" style="background-color:${categoryColor(name)}"></span>
        <span class="category-picker-name">${escapeHTML(name)}</span>
        <span class="category-picker-check" aria-hidden="true">${name===selected?'✓':''}</span>
      </button>`).join('')}
    </div>
  </section>`;
  overlay.addEventListener('click',event=>{
    if(event.target===overlay || event.target.closest('[data-close]')){closeCategoryPicker();return;}
    const option=event.target.closest('[data-category-index]');
    if(!option)return;
    const index=Number(option.dataset.categoryIndex);
    if(!Number.isInteger(index)||!names[index])return;
    const name=names[index];
    input.value=name;
    updateSelectedCategoryDisplay(box,name);
    closeCategoryPicker();
  });
  overlay.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();closeCategoryPicker();}
  });
  // La fenêtre reste dans le cadre de l'application, sans déborder du viewport iOS.
  document.getElementById('device').appendChild(overlay);
  const selectedRow=overlay.querySelector('.category-picker-item.selected');
  const list=overlay.querySelector('.category-picker-list');
  if(selectedRow && list){
    const position=[...list.children].indexOf(selectedRow);
    list.scrollTop=Math.max(0,position*58-Math.max(0,list.clientHeight/3));
  }
  // Un focus automatique sur mobile peut réactiver le zoom Safari : on l'évite.
  if(!window.matchMedia('(pointer: coarse)').matches){
    (selectedRow||overlay.querySelector('.category-picker-item')||overlay.querySelector('[data-close]'))?.focus({preventScroll:true});
  }
  };
  // Laisser l'animation de fermeture du clavier se terminer avant de montrer les catégories.
  categoryPickerOpenTimer=window.setTimeout(openPickerPanel,200);
}
function updateSelectedCategoryDisplay(box,name){
  const trigger=box?.querySelector('.category-trigger');
  if(!trigger)return;
  const color=categoryColor(name);
  const label=trigger.querySelector('.category-trigger-name');
  const chip=trigger.querySelector('.category-color-chip');
  if(label)label.textContent=name;
  if(chip)chip.style.backgroundColor=color;
  trigger.setAttribute('aria-label','Choisir une catégorie. Sélection actuelle : '+name);
}
const moneyBalFor = (source,a) => {
  let real=a.initial, cleared=a.initial;
  for(const t of source.transactions.filter(t=>t.account===a.id)) {
    if(t.status!=='cancelled')real+=t.amount;
    if(t.status==='cleared')cleared+=t.amount;
  }
  return {real,cleared};
};
const moneyBal = a => moneyBalFor(data,a);
const running = accountID => {
  let n=account(accountID)?.initial || 0;const vals={};
  for(const t of txFor(accountID).reverse()){
    if(t.status!=='cancelled') n+=t.amount;
    vals[t.id]=n;
  }
  return vals;
};

function sample() {
  const a=uid(),b=uid(),c=uid();

function normalize(obj) {
  if(!obj || !Array.isArray(obj.accounts) || !Array.isArray(obj.transactions)) throw Error('Données malformées');
  let names=[];
  if(Array.isArray(obj.categories)) names.push(...obj.categories.map(x=>typeof x==='string'?x:x.name));
  names.push(...obj.transactions.map(t=>t.category));
  if(!obj.isRealData)names.push(...Object.keys(DEFAULT_COLORS));
  const oldBudget=obj.budget || (obj.budgets||[]).find(b=>b.period==='year');
  if(oldBudget) names.push(...(oldBudget.lines||[]).map(l=>l.category));
  names=[...new Set(names.filter(Boolean))];
  const definitions=names.map(name=>{
    const old=(obj.categories||[]).find(x=>typeof x==='object' && x.name===name);
    return {name,color:safeHex(old?.color||DEFAULT_COLORS[name]||'#8c9ba8'),active:old?.active!==false};
  });
  // Never multiply former monthly budget amounts by 12 or mislabel them as annual.
  const b=oldBudget?{...oldBudget,id:oldBudget.id||uid(),name:'Budget annuel',period:'year',
    lines:(oldBudget.lines||[]).map(l=>({...l,id:l.id||uid()}))}:
    {id:uid(),name:'Budget annuel',period:'year',accounts:obj.accounts.map(a=>a.id),lines:[]};
  return {accounts:obj.accounts,transactions:obj.transactions.map(t=>({...t,recurrence:t.recurrence||'none',repeatNotice:t.repeatNotice||(t.recurrence==='fourweeks'?'fourweeks':'month')})),categories:definitions,budget:b,isRealData:obj.isRealData===true,verified:obj.verified===true,importedAt:obj.importedAt||null};
}

// Rotation de trois états locaux. Ne remplace PAS les sauvegardes JSON exportées.
function readHistory(){
  try{const v=JSON.parse(localStorage.getItem(KEY+'-history')||'[]');return Array.isArray(v)?v.filter(x=>x&&typeof x.snapshot==='string').slice(0,3):[];}
  catch(e){return [];}
}
function persist(){
  try{
    const latest=JSON.stringify(data),previous=localStorage.getItem(KEY);
    if(previous!==null && previous!==latest && (data.isRealData || JSON.parse(previous).isRealData)){
      const history=readHistory();
      if(!history.length||history[0].snapshot!==previous){
        history.unshift({at:new Date().toISOString(),snapshot:previous});
        localStorage.setItem(KEY+'-history',JSON.stringify(history.slice(0,3)));
      }
    }
    localStorage.setItem(KEY,latest);
    if(localStorage.getItem(KEY)!==latest)throw Error('Lecture de contrôle impossible');
    return true;
  }catch(e){storageWarning=true;console.warn('Stockage local indisponible',e);return false;}
}

function budgetData(year=budgetYear){
  const start=`${year}-01-01`,end=`${year+1}-01-01`;
  const included=[...data.transactions,...recurringProjections(year)].filter(t=>
    data.budget.accounts.includes(t.account)&&t.status!=='cancelled'&&t.date>=start&&t.date<end);
  // Keep signed amounts: a refund reduces expense, a salary correction reduces
  // income. Internal transfers count in the chosen budget account, as in
  // iCompta 2. If both accounts are included, the two entries offset.
  const allocationValue=(l,t)=>{
    const signedSlice=(ratio)=> {
      const raw=t.amount*ratio;
      const value=Math.sign(raw)*Math.round(Math.abs(raw));
      return l.side==='expense' ? -value : value;
    };
    if(Array.isArray(t.allocations)&&t.allocations.length)
      return t.allocations.filter(a=>a.category===l.category).reduce((n,a)=>n+signedSlice(a.ratio),0);
    return t.category===l.category?signedSlice(1):0;
  };
  return data.budget.lines.map(l=>({...l,
    cleared:included.filter(t=>t.status==='cleared').reduce((s,t)=>s+allocationValue(l,t),0),
    forecast:included.reduce((s,t)=>s+allocationValue(l,t),0)
  }));
}

}

 });

 });

 });
 for(const pair of transfers.values()){
  if(pair.length!==2||pair[0].amountCents+pair[1].amountCents!==0||pair[0].accountID===pair[1].accountID)throw Error('Le fichier contient un virement incomplet ou non équilibré.');
 }

function checkNativeBackup(raw){

 if(!Array.isArray(v.accounts)||!Array.isArray(v.transactions)||!v.budget||!Array.isArray(v.categories))throw Error('Sauvegarde incomplète.');
 const ac=new Set(v.accounts.map(x=>x.id)); const ids=new Set();
 if(v.accounts.length>100||v.transactions.length>250000)throw Error('Sauvegarde trop volumineuse.');
 for(const t of v.transactions){if(!validID(t.id)||ids.has(t.id)||!ac.has(t.account)||!validDate(t.date)||!Number.isSafeInteger(t.amount))throw Error('Opération non valide dans la sauvegarde.');ids.add(t.id);}

   <label class="confirm-import"><input type="checkbox" id="importConsent" onchange="$('applyImportButton').disabled=!this.checked"> J’ai conservé une copie de mes anciennes données et je confirme le remplacement.</label>
   <button class="softbtn wide" id="applyImportButton" onclick="applyImport()" disabled>Importer ces données</button>`;
 }catch(e){preview.textContent='Import refusé : '+String(e.message||e);stagedImport=null;}
}
function applyImport(){
 if(!stagedImport||!$('importConsent')?.checked)return;
 if(!confirm('Confirmer l’import de cette sauvegarde ? Les données actuellement affichées seront remplacées.'))return;
 try{
  const previous=JSON.stringify(data),incoming=JSON.stringify(stagedImport);
  localStorage.setItem(KEY+'-precedent',previous);
  // Le précédent état reste disponible même si l’application est réouverte.
  const history=readHistory();history.unshift({at:new Date().toISOString(),snapshot:previous});
  localStorage.setItem(KEY+'-history',JSON.stringify(history.slice(0,3)));
  localStorage.setItem(KEY,incoming);
  if(localStorage.getItem(KEY)!==incoming)throw Error('Contrôle écriture impossible');
  data=stagedImport;stagedImport=null;accountId=null;editMode=false;budgetYear=new Date().getFullYear();
  show('audit');alert('Import effectué localement. Contrôle les soldes avant d’activer les récurrences.');
 }catch(e){alert('Import interrompu : '+String(e.message||e)+'. Vérifie la sauvegarde avant de réessayer.');}
}

function restorePrevious(){
 if(!confirm('Revenir à la copie locale conservée avant le dernier import ?'))return;
 try{const p=localStorage.getItem(KEY+'-precedent');if(!p)throw Error('Aucune copie disponible');const old=normalize(JSON.parse(p));const current=JSON.stringify(data);localStorage.setItem(KEY,JSON.stringify(old));localStorage.setItem(KEY+'-precedent',current);data=old;show('home');}
 catch(e){alert('Restauration impossible : '+e.message);}
}
function restoreRecentState(index){
 const history=readHistory(),item=history[index];if(!item)return;
 if(!confirm('Revenir à cet état de secours ? Les modifications les plus récentes seront remplacées. Exporte une sauvegarde avant de continuer.'))return;
 try{
  const old=normalize(JSON.parse(item.snapshot));const current=JSON.stringify(data);
  history.splice(index,1);history.unshift({at:new Date().toISOString(),snapshot:current});
  localStorage.setItem(KEY+'-history',JSON.stringify(history.slice(0,3)));
  localStorage.setItem(KEY,JSON.stringify(old));data=old;show('audit');
 }catch(e){alert('État non restauré : '+String(e.message||e));}
}
function auditScreen(){
 header('Vérifier les soldes',nbtn('‹ Données',"show('info')"),'');
 const totals={real:0,cleared:0};
 const rows=data.accounts.map(a=>{
  const b=moneyBal(a);totals.real+=b.real;totals.cleared+=b.cleared;
  return `<tr><td>${escapeHTML(a.name)}</td><td>${euro(b.real)}</td><td>${euro(b.cleared)}</td></tr>`;
 }).join('');
 const recurrent=data.transactions.filter(t=>['monthly','fourweeks'].includes(t.recurrence)).length;
 $('content').innerHTML=`<div class="info"><h3>Contrôle après importation</h3>
  <p>Compare les montants ci-dessous avec ceux de ton fichier ou de l’ancien iCompta 2 <strong>à la même date</strong>. Les photos prises à une autre date peuvent présenter des différences normales.</p>
  <table class="audit-table"><thead><tr><th>Compte</th><th>Solde</th><th>Pointé</th></tr></thead><tbody>${rows}
  <tr class="audit-total"><th>Total</th><th>${euro(totals.real)}</th><th>${euro(totals.cleared)}</th></tr></tbody></table>
  <p>${data.transactions.length} écritures · ${recurrent} règles de récurrence · ${data.budget.lines.length} lignes de budget.</p>
  <p><strong>État des récurrences :</strong> ${data.isRealData?(data.verified?'activées':'suspendues en attendant ton contrôle'):'démonstration'}.</p>
  <button class="softbtn wide" onclick="exportBackup()">↓ Sauvegarder avant de continuer</button>
  <button class="softbtn wide" onclick="show('budget')">Voir le budget annuel</button>
  ${data.isRealData&&!data.verified?'<button class="softbtn wide" onclick="enableRecurrences()">Activer les récurrences après contrôle</button>':''}
  <p class="smallnote warning">Ce tableau calcule les soldes depuis les données importées. Il ne prouve pas, à lui seul, leur concordance avec l’ancien iCompta.</p>
  </div>`;
 $('toolbar').innerHTML=btn('Accueil','⌂',"show('home')")+btn('Données','⇧',"show('info')");
}
function enableRecurrences(){
 if(!data.isRealData || data.verified===true)return;
 if(!confirm('Tu as vérifié les soldes de tous tes comptes et exporté une sauvegarde ? Activer la création automatique des prochaines échéances au lancement ?'))return;
 data.verified=true;autoAdvanceRecurrences();persist();show('info');
}
async function actualiserApplication(){
  if(location.protocol==='file:'){
    alert('La version locale Mac se met à jour en ouvrant le nouveau fichier HTML.');
    return;
  }
  if(!navigator.onLine){
    alert('Active le Wi-Fi pour vérifier la version publiée. Tes comptes restent accessibles hors connexion.');
    return;
  }
  try{
    const url=new URL('./index.html',location.href);
    url.searchParams.set('_v',String(Date.now()));
    const response=await fetch(url.toString(),{cache:'no-store'});
    if(!response.ok)throw Error('Le site répond HTTP '+response.status);
    const source=await response.text();
    const match=source.match(/<title>iCompta Classic — V([0-9.]+)<\/title>/);
    if(!match)throw Error('Numéro de version introuvable sur le site.');
    const online=match[1];
    if(online===APP_VERSION){
      alert('Version V'+APP_VERSION+' confirmée. La comptabilité locale est inchangée.');
      return;
    }
    const parseVersion=s=>s.split('.').map(n=>Number(n));
    const local=parseVersion(APP_VERSION),remote=parseVersion(online);
    const newer=remote[0]>local[0]||(remote[0]===local[0]&&(remote[1]||0)>(local[1]||0));
    if(!newer){
      alert('Le site public annonce V'+online+' alors que cette application est en V'+APP_VERSION+'. Vérifie la branche main et la publication GitHub Pages, sans effacer tes données.');
      return;
    }
    const reg=await navigator.serviceWorker?.getRegistration();
    if(reg)await reg.update();
    // Ces caches ne stockent que les fichiers publics de l'application.
    if('caches' in window){
      const cacheKeys=await caches.keys();
      await Promise.all(cacheKeys.filter(key=>key.startsWith('icompta-classic-shell-')).map(key=>caches.delete(key)));
    }
    alert('La V'+online+' est en ligne. L’application va recharger le code. Tes comptes et opérations ne sont pas effacés.');
    location.replace(new URL('./index.html?maj='+encodeURIComponent(online)+'-'+Date.now(),location.href).toString());
  }catch(err){
    alert('Vérification impossible : '+String(err.message||err)+'. Ne supprime pas l’application ni ses données.');
  }
}

function info(){
 header('Données locales',nbtn('‹ iCompta',"show('home')"),'');
 const recent=readHistory().map((x,i)=>`<button class="softbtn wide" onclick="restoreRecentState(${i})">↶ État de secours ${i+1} · ${escapeHTML(new Date(x.at).toLocaleString('fr-FR'))}</button>`).join('');
 $('content').innerHTML=`<div class="info"><h3>iCompta Classic · V${APP_VERSION} locale</h3>
 <p><strong>${data.isRealData?'Comptabilité importée':'Démonstration avec montants fictifs'}</strong>. Aucune connexion bancaire, aucun abonnement. Les données sont conservées dans le navigateur de cet appareil.</p>
 ${migratedFrom?'<p class="smallnote">Une précédente version a été détectée. La sauvegarde V0.7 reste inchangée.</p>':''}
 <p class="smallnote warning">Prototype non audité. Le stockage du navigateur peut être effacé. Les fichiers JSON exportés ne sont pas chiffrés : garde-les dans un endroit privé.</p>
 <h3>1. Importer une comptabilité</h3>
 <p>Fichier accepté : ton import privé JSON ou une sauvegarde iCompta Classic. Lecture uniquement sur cet appareil.</p>
 <input id="importFile" aria-label="Fichier JSON privé à importer" type="file" accept=".json,application/json" onchange="prepareImport(event)">
 <div id="importPreview" class="fieldpanel importbox">Aucun fichier sélectionné.</div>
 <p class="smallnote">Affichage arrondi à l’euro : les centimes restent conservés dans les calculs et les sauvegardes.</p>
 <h3>2. Sauvegarde et contrôle</h3>
 <button class="softbtn wide" onclick="exportBackup()">↓ Exporter une sauvegarde JSON</button>
 <button class="softbtn wide" onclick="show('audit')">✓ Contrôler les soldes par compte</button>
 <button class="softbtn wide" onclick="restorePrevious()">↶ Revenir aux données avant le dernier import</button>
 <h3>3. États de secours locaux</h3>
 <p>Les trois derniers états sont conservés automatiquement dans le navigateur lorsque des données réelles sont modifiées. Ils peuvent disparaître si Safari efface son stockage : ce n’est pas un remplacement des sauvegardes JSON.</p>
 ${recent||'<p class="smallnote">Aucun état de secours disponible.</p>'}
 <h3>4. Opérations récurrentes</h3>
 <p>${data.verified?'Création automatique des échéances : activée.':data.isRealData?'Création automatique : suspendue jusqu’à vérification des soldes. Les prochaines échéances figurent dans les prévisions.':'Création automatique active sur les données fictives.'}</p>
 ${data.isRealData&&!data.verified?'<button class="softbtn wide" onclick="enableRecurrences()">Activer après vérification des soldes</button>':''}
 <h3>5. Mises à jour</h3>
 <p>Version installée : <strong>V${APP_VERSION}</strong>. Le bouton ci-dessous recharge uniquement les fichiers publics, sans supprimer les comptes locaux.</p>
 <button class="softbtn wide" onclick="actualiserApplication()">↻ Vérifier la version et actualiser</button>
 <h3>6. Installation et fonctionnement</h3>
 <p>${location.protocol==='file:'?'Ouvert en fichier local : utilisation sur Mac, sans installation iPhone.':'Version web : pour installer sur iPhone, ouverture initiale en HTTPS, puis ajout à l’écran d’accueil.'}</p>
 <p>Les écrans Budget, Échéancier et Opérations reprennent les photographies originales d’iCompta 2.</p>
 ${storageWarning?'<p class="warning">Attention : stockage indisponible ou saturé. Exporte immédiatement une sauvegarde avant toute autre modification.</p>':''}
 <p class="smallnote">Aucune télémétrie ; aucun fichier financier inclus dans le code de l’application.</p>
 </div>`;
 $('toolbar').innerHTML=btn('Accueil','⌂',"show('home')")+btn('Budget','▤',"show('budget')");
}

function reset(){
 if(data.isRealData){alert('Réinitialisation désactivée pour éviter de supprimer des données réelles. Utilise la restauration ou une sauvegarde.');return;}
 if(!confirm('Réinitialiser seulement les données fictives ?'))return;
 data=sample();persist();accountId=null;editMode=false;budgetYear=new Date().getFullYear();show('home');
}

function render(){switch(screen){
  case 'home':home();break;case 'transactions':transactions();break;case 'txEditor':transactionEditor();break;
  case 'accountEditor':accountEditor();break;case 'categories':categoriesScreen();break;case 'categoryEditor':categoryEditor();break;
  case 'transfer':transferEditor();break;case 'budget':budgetScreen();break;case 'budgetEditor':budgetEditor();break;
  case 'info':info();break;case 'audit':auditScreen();break;case 'schedule':scheduleScreen();break;default:show('home');break;
}}
persist();render();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{if(navigator.onLine)reg.update().catch(()=>{});}).catch(err=>console.warn('Mode hors ligne non activé',err));
</script>
